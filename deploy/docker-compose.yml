services:
  mysql:
    image: mariadb:11.8
    container_name: news-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: GilangRizky
      MYSQL_DATABASE: news_portal
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - news-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: news-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - news-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: news-api
    restart: unless-stopped
    environment:
      PORT: 8080
      ENV: production
      LOG_LEVEL: info
      DB_DSN: "root:GilangRizky@tcp(mysql:3306)/news_portal?parseTime=true&loc=UTC"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      JWT_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      MEDIA_STORAGE_DIR: "/data/media"
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:3000,http://localhost:4321,http://localhost:5173"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/data/media
    networks:
      - news-network
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: news-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4321
      HOST: 0.0.0.0
      INTERNAL_API_URL: "http://api:8080/api/v1"
      PUBLIC_API_URL: "http://localhost:8080/api/v1"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - news-network
    ports:
      - "4321:4321"

  admin:
    build:
      context: ../apps/admin
      dockerfile: Dockerfile
    container_name: news-admin
    restart: unless-stopped
    environment:
      VITE_API_URL: "http://localhost:8080/api/v1"
    networks:
      - news-network
    ports:
      - "5173:5173"

  nginx:
    image: nginx:alpine
    container_name: news-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - media_data:/data/media:ro
    depends_on:
      - web
      - admin
      - api
    networks:
      - news-network

networks:
  news-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  media_data:
